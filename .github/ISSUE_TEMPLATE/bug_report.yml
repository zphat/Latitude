name: Bug report
description: Help reproduce a Latitude beta problem without private recordings.
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened, and how can we reproduce it?
      description: Include what you expected and the exact steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Version and technical details
      description: Paste Settings → Technical details after reviewing it. Include OS/version; on Linux add desktop and Wayland/X11. For Mac previews add Intel or Apple Silicon.
      render: json
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Capture devices and recording conditions
      description: Mic/interface, webcam, screen/window, desktop audio routing, take length, and any other running programs.
  - type: textarea
    id: sample
    attributes:
      label: Optional screenshot or short sample
      description: Only share content you are comfortable making public. Never attach private recordings or credentials.
