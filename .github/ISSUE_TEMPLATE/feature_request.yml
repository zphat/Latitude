name: Feature request
description: Suggest a workflow improvement or extension.
title: '[Idea]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the recording or editing task and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested improvement
      description: Include how it could stay simple and efficient. Streaming ideas may fit a future mod.
