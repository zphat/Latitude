name: Build Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare the Windows encoder
        run: node scripts/prepare-encoder.cjs
      - name: Build unsigned test package
        run: npm run dist:win -- --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Record checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Latitude-Windows-x64-test-build
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
