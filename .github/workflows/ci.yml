name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate dependency lockfile without installing runtime binaries
        run: npm ci --ignore-scripts
      - name: Install test encoder and probe
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Run audio, scene, storage, and export tests
        run: npm test
        env:
          TAKE_FFMPEG: /usr/bin/ffmpeg
