name: macOS preview build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['electron/**', 'audio/**', 'src/**', 'package*.json', 'scripts/*mac*', 'packaging/mac/**', 'tests/mac.test.cjs', 'tests/editor-mod-ui.cjs', 'tests/session-names*', 'tests/loudness*', '.github/workflows/mac.yml']
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci
      - name: Install the pinned Electron runtime and verify its notices before compiling
        run: |
          npm run setup
          node scripts/prepare-mac-encoder.cjs --runtime-notices-only
      - run: python3 tests/mac-release.test.py
      - run: brew install nasm pkgconf
      - name: Build redistributable encoder from pinned sources
        run: python3 scripts/build-mac-encoder.py
      - run: node scripts/prepare-mac-encoder.cjs
      - name: Use the matching source-built probe for tests
        run: echo "${{ github.workspace }}/vendor" >> "$GITHUB_PATH"
      - name: Test the bundled encoder
        run: npm test
        env:
          TAKE_FFMPEG: ${{ github.workspace }}/vendor/ffmpeg
      - name: Test native editor layout, keyboard controls, save and separate-track export
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          node tests/editor-mod-ui.cjs
          node tests/session-names-ui.cjs
        env:
          TAKE_FFMPEG: ${{ github.workspace }}/vendor/ffmpeg
          TMPDIR: ${{ runner.temp }}
      - run: npm run dist:mac -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installed app contents and native launch
        run: python3 scripts/verify-mac-package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Latitude-macOS-${{ matrix.arch }}-unsigned-preview
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-Encoder-Sources.tar.gz
            dist/SHA256SUMS-macOS-*.txt
          if-no-files-found: error
          compression-level: 0
      - name: Retain native editor screenshots and export evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Mac-editor-QA-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/latitude-edit-ui-*/shots/*.png
            ${{ runner.temp }}/latitude-names-ui-*/shots/*.png
          if-no-files-found: ignore

  publish:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'Publish Latitude macOS preview v') || startsWith(github.event.head_commit.message, 'Release Latitude v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: latitude-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: Latitude-macOS-*-unsigned-preview
          path: release-assets
          merge-multiple: true
      - name: Publish matching Mac previews without replacing any existing download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-mac-preview.py
