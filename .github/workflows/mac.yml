name: macOS preview build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['electron/**', 'audio/**', 'src/**', 'package*.json', 'scripts/prepare-mac-encoder.cjs', '.github/workflows/mac.yml']
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci
      - run: brew install ffmpeg
      - run: npm test
      - run: node scripts/prepare-mac-encoder.cjs
      - run: npm run dist:mac -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Latitude-macOS-${{ matrix.arch }}-unsigned-preview
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
