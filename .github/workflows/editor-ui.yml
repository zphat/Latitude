name: Native editor QA
on:
  pull_request:
    paths: ['src/mods/editor/**', 'tests/editor*', 'electron/editor*', '.github/workflows/editor-ui.yml', '.github/workflows/updater-live.yml', '.github/workflows/release.yml', '.github/workflows/linux.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Prepare native export test encoder
        run: |
          bash scripts/prepare-ci-apt.sh
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Verify creative library, save/export, exact scrubbing and gestures
        env:
          TAKE_FFMPEG: /usr/bin/ffmpeg
          LATITUDE_QA_INLINE_IMAGES: '1'
          TMPDIR: ${{ runner.temp }}
        run: |
          node tests/editor-creative-ui.cjs
          node tests/editor-mod-ui.cjs
          node tests/editor-scrub-ui.cjs
          node tests/editor-gestures-ui.cjs
      - name: Retain native editor screenshots, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Editor-library-QA
          path: |
            ${{ runner.temp }}/latitude-creative-ui-*/*.png
            ${{ runner.temp }}/latitude-edit-ui-*/shots/*.png
            ${{ runner.temp }}/latitude-scrub-ui-*/*.png
            ${{ runner.temp }}/latitude-gestures-ui-*/*.png
          if-no-files-found: ignore
          retention-days: 14
  live-updater:
    uses: ./.github/workflows/updater-live.yml
