name: Linux preview

on:
  push:
    branches: [linux/port]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audio:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: pulseaudio
            os: ubuntu-22.04
          - server: pipewire
            os: ubuntu-24.04
          - server: pipewire
            os: ubuntu-22.04
            legacy: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install audio server test tools
        run: |
          bash scripts/prepare-ci-apt.sh
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libpulse-dev pulseaudio pulseaudio-utils pipewire pipewire-pulse wireplumber
      - run: npm run build:linux-audio
      - name: Test real audio routing and cleanup
        env:
          LATITUDE_AUDIO_SERVER: ${{ matrix.server }}
          LATITUDE_LEGACY_PIPEWIRE: ${{ matrix.legacy }}
        run: dbus-run-session -- bash scripts/test-linux-audio.sh

  package:
    # 1.4+ uses appstreamcli; the 25.08 SDK no longer ships appstream-compose.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install build and test tools
        run: |
          bash scripts/prepare-ci-apt.sh
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libpulse-dev pulseaudio pulseaudio-utils flatpak flatpak-builder libarchive-tools elfutils xvfb xauth appstream desktop-file-utils ffmpeg
          flatpak-builder --version
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' flatpak-builder)" ge 1.4
      - run: npm ci
      - run: npm run build:linux-audio
      - run: node scripts/prepare-encoder.cjs
      - name: Test shared application and every bundled encoder format
        run: npm test
      - name: Verify native editor and update UI
        env:
          LATITUDE_UPDATE_LIVE_CHECK: "1"
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          node tests/editor-mod-ui.cjs
          node tests/updater-ui.cjs
      - name: Validate application metadata
        run: appstreamcli validate --no-net packaging/studio.latitude.recorder.metainfo.xml
      - name: Install matching Flatpak runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - name: Build installable Linux desktop package
        env:
          DEBUG: "@malept/flatpak-bundler"
        run: npm run dist:linux -- --x64 --publish never
      - name: Verify installation, launch, and bundled tools
        run: dbus-run-session -- bash scripts/test-linux-package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Latitude-Linux-release
          path: |
            dist/Latitude-*-Linux-x86_64.flatpak
            dist/SHA256SUMS-Linux.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
