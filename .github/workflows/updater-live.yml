name: Live updater verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Verify native updater and real public metadata/checksum with production transport
        env:
          LATITUDE_UPDATE_LIVE_CHECK: '1'
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node tests/updater-ui.cjs
      - name: Retain native updater evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Updater-QA-${{ matrix.os }}
          path: ${{ runner.temp }}/latitude-update-ui-*/*.png
          if-no-files-found: ignore
          retention-days: 14
